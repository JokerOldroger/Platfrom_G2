controller_manager:
  ros__parameters:
    update_rate: 100

joint_state_broadcaster:
  ros__parameters:
    type: joint_state_broadcaster/JointStateBroadcaster

arm_controller:
  ros__parameters:
    type: joint_trajectory_controller/JointTrajectoryController
    joints:
      - joint2_to_joint1
      - joint3_to_joint2
      - joint4_to_joint3
      - joint5_to_joint4
      - joint6_to_joint5
      - joint6output_to_joint6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 2.0
      joint2_to_joint1:
        trajectory: 0.2
        goal: 0.05
      joint3_to_joint2:
        trajectory: 0.2
        goal: 0.05
      joint4_to_joint3:
        trajectory: 0.2
        goal: 0.05
      joint5_to_joint4:
        trajectory: 0.2
        goal: 0.05
      joint6_to_joint5:
        trajectory: 0.2
        goal: 0.05
      joint6output_to_joint6:
        trajectory: 0.2
        goal: 0.05
